name: CI Pipeline

on:
  pull_request:
    branches: [ "master", "staging", "dev" ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ "master", "staging" ]

jobs:
  test:
    runs-on: windows-latest

    env:
      CONFIG: ${{ github.base_ref == 'dev' && 'Debug' || 'Release'}}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore solution dependencies
      run: dotnet restore

    - name: Build solution
      run: |
        dotnet build `
          --no-restore `
          --configuration "${{ env.CONFIG }}" `
          --verbosity normal

    - name: Run tests
      run: |
        dotnet test `
          --no-build `
          --configuration ${{ env.CONFIG }} `
          --verbosity normal

  package:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore solution dependencies
      run: dotnet restore
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Package WinUI 3 App
      run: |
        msbuild XeniaDeck\XeniaDeck.csproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxBundle=Always

    - name: Upload MS Store package
      uses: actions/upload-artifact@v4
      with:
        name: msixupload
        path: "**/*.msixupload"
        if-no-files-found: error
        retention-days: 30
