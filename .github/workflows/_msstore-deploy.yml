name: MS Store Packaging and Publishing Engine

on:
  workflow_call:
    inputs:
      flight_id:
        required: true
        type: string
        description: "The Microsoft Store flight ring ID"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Required for WinUI 3 AppX/MSIX packaging projects
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore and Package WinUI 3 App
      run: |
        dotnet restore
        msbuild
          /p:Configuration=Release
          /p:Platform=x64
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxBundle=Always

    - name: Configure Microsoft Store CLI
      uses: microsoft/microsoft-store-apppublisher@v1.4

    - name: Authenticate and Publish to Store
      run: |
        msstore reconfigure
          --tenantId ${{ secrets.MS_TENANT_ID }}
          --sellerId ${{ secrets.MS_SELLER_ID }}
          --clientId ${{ secrets.MS_CLIENT_ID }}
          --clientSecret ${{ secrets.MS_CLIENT_SECRET }}
        msstore publish
          "AppPackages/**/*.msixupload"
          --id ${{ inputs.flight_id }}
